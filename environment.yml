  - pytorch
  - nodefaults

dependencies:
  - python=3.8.5
  - cudatoolkit=10.0
  - numpy=1.20.3
  - pip
  - setuptools=65.5.0
  - pip:
      - gym==0.18.3
      - mujoco-py==2.0.2.13
      - torch==1.8.1
      - transformers==4.5.1
      - wandb==0.9.1