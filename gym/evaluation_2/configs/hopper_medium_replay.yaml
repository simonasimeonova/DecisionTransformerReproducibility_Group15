experiment_id: hopper_medium_replay
environment: hopper
dataset: medium-replay-v2

# Paths will be resolved relative to this YAML file, not the terminal directory.
# Architecture, K, normalization and return scale must come from the checkpoint.
checkpoints:
  k1: null
  k20: null

return_conditioning:
  enabled: true
  checkpoints: [k20]
  targets: []  # Initial episode targets in RAW reward units; still to be decided.

context_comparison:
  enabled: true
  checkpoints: [k1, k20]
  targets: []  # This same list applies to BOTH checkpoints.

# Optionally override individual defaults here, for example:
# evaluation:
#   episode_seeds: [1000, 1001]
