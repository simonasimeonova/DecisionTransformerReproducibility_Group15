experiment_id: hopper_medium_expert
environment: hopper
env_id: Hopper-v3  # Matches the current training code; do not change only for evaluation.
dataset: medium-expert-v2
dataset_path: ../../../../training-storage/datasets/hopper-medium-expert-v2.pkl

# Training runs are grouped under results/<environment>_K<K>/.
# The * matches the timestamped run folder; each path must match exactly one file.
checkpoints:
  k1_seed42:
    path: ../../../../results/hopper_K1/hopper_K1_seed42_*/checkpoints/hopper_medium-expert_K1_seed42.pt
    K: 1
    training_seed: 42
  k1_seed43:
    path: ../../../../results/hopper_K1/hopper_K1_seed43_*/checkpoints/hopper_medium-expert_K1_seed43.pt
    K: 1
    training_seed: 43
  k1_seed44:
    path: ../../../../results/hopper_K1/hopper_K1_seed44_*/checkpoints/hopper_medium-expert_K1_seed44.pt
    K: 1
    training_seed: 44
  k20_seed42:
    path: ../../../../results/hopper_K20/hopper_K20_seed42_*/checkpoints/hopper_medium-expert_K20_seed42.pt
    K: 20
    training_seed: 42
  k20_seed43:
    path: ../../../../results/hopper_K20/hopper_K20_seed43_*/checkpoints/hopper_medium-expert_K20_seed43.pt
    K: 20
    training_seed: 43
  k20_seed44:
    path: ../../../../results/hopper_K20/hopper_K20_seed44_*/checkpoints/hopper_medium-expert_K20_seed44.pt
    K: 20
    training_seed: 44

return_conditioning:
  enabled: true
  checkpoints: [k20_seed42, k20_seed43, k20_seed44]
  targets: [0, 600, 1200, 1800, 2400, 3000, 3600, 4200]

context_comparison:
  enabled: true
  checkpoints: [k1_seed42, k1_seed43, k1_seed44, k20_seed42, k20_seed43, k20_seed44]
  targets: [3600]
